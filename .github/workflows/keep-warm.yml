# Render's free tier sleeps after 15 min idle (~50s cold start).
# Pinging every 10 minutes keeps the demo instant. Set API_URL in repo Settings → Variables.
name: keep-warm
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ vars.API_URL }}/health"
